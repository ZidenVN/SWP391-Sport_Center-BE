$kind: http-request
name: B6. Danh sách check-in hôm nay -> có lượt vừa tạo
url: ""
method: GET
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const list = pm.response.json();
      pm.test('Có lượt check-in vừa tạo', () =>
        pm.expect(list.map(x => x.checkInId)).to.include(Number(pm.collectionVariables.get('checkInId'))));
      pm.test('Mới nhất trước', () => {
        for (let i = 1; i < list.length; i++) pm.expect(list[i-1].checkInTime >= list[i].checkInTime).to.be.true;
      });
    language: text/javascript
order: 8000
