$kind: http-request
name: POST đăng ký gói (CASH) -> PENDING
url: "{{base_url}}/api/v1/receptionist/members/{{memberId}}/subscriptions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "packageId": {{packageId}},
      "paymentMethod": "CASH"
    }
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('subscriptionId', pm.response.json().subscriptionId);
      if (pm.response.code < 300) pm.collectionVariables.set('paymentId', pm.response.json().paymentId);
    language: text/javascript
order: 9000
