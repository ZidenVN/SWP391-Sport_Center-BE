$kind: http-request
url: "{{base_url}}/api/v1/receptionist/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "QA",
      "lastName": "NoSub {{run}}",
      "gender": "MALE",
      "email": "qa.nosub.{{run}}@example.com",
      "phone": "06{{run}}",
      "trainingGoal": "Kiểm thử check-in"
    }
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('memberNoSubId', pm.response.json().member.memberId);
    language: text/javascript
order: 12000
