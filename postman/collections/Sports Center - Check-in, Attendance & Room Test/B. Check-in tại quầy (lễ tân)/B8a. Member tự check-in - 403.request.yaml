$kind: http-request
name: B8a. Member tự check-in -> 403
url: "{{base_url}}/api/v1/receptionist/members/{{memberId}}/check-ins"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 10000
