$kind: http-request
name: B2. Check-in lần 2 trong ngày -> 409
url: "{{base_url}}/api/v1/receptionist/members/{{memberId}}/check-ins"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409 ALREADY_CHECK_IN', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error).to.eql('ERR_CHECKIN_001');
      });
    language: text/javascript
order: 2000
