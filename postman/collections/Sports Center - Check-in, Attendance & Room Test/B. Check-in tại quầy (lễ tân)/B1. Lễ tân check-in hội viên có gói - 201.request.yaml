$kind: http-request
name: B1. Lễ tân check-in hội viên có gói -> 201
url: "{{base_url}}/api/v1/receptionist/members/{{memberId}}/check-ins"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test('Đúng member', () => pm.expect(r.memberId).to.eql(Number(pm.collectionVariables.get('memberId'))));
      pm.test('Có id, tên, SĐT, giờ check-in', () => {
        pm.expect(r.checkInId).to.be.a('number');
        pm.expect(r.memberName).to.be.a('string');
        pm.expect(r.phone).to.eql(pm.collectionVariables.get('phoneMember'));
        pm.expect(r.checkInTime).to.be.a('string');
      });
      pm.test('Có tên lễ tân, gói, hạn gói', () => {
        pm.expect(r.receptionistName).to.be.a('string');
        pm.expect(r.packageName).to.eql('QA Package ' + pm.collectionVariables.get('run'));
        pm.expect(r.subscriptionEndDate).to.be.a('string');
      });
      if (pm.response.code === 201) pm.collectionVariables.set('checkInId', r.checkInId);
    language: text/javascript
order: 1000
