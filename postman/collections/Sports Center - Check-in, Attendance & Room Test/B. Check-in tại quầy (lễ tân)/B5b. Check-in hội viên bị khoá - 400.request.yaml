$kind: http-request
name: B5b. Check-in hội viên bị khoá -> 400
url: "{{base_url}}/api/v1/receptionist/members/{{memberId}}/check-ins"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400 MEMBER_INACTIVE', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('ERR_CHECKIN_002');
      });
    language: text/javascript
order: 6000
