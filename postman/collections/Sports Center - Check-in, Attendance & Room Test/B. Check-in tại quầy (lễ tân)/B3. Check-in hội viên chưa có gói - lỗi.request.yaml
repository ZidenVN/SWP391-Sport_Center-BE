$kind: http-request
name: B3. Check-in hội viên chưa có gói -> lỗi
url: "{{base_url}}/api/v1/receptionist/members/{{memberNoSubId}}/check-ins"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Bị chặn (400/422)', () => pm.expect(pm.response.code).to.be.oneOf([400, 422]));
      pm.test('Có mã lỗi', () => pm.expect(pm.response.json().error).to.be.a('string'));
    language: text/javascript
order: 3000
