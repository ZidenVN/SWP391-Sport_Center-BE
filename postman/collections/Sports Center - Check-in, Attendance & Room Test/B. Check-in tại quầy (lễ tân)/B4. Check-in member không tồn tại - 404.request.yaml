$kind: http-request
name: B4. Check-in member không tồn tại -> 404
url: "{{base_url}}/api/v1/receptionist/members/999999999/check-ins"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 4000
