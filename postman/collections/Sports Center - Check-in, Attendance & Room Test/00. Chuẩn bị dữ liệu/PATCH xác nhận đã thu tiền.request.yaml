$kind: http-request
url: "{{base_url}}/api/v1/receptionist/payments/{{paymentId}}/confirm"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "QA thu tiền mặt"
    }
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      pm.test('status = COMPLETED', () => pm.expect(pm.response.json().status).to.eql('COMPLETED'));
    language: text/javascript
order: 11000
