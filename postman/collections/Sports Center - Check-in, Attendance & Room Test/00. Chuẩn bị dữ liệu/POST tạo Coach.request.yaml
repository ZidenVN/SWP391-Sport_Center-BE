$kind: http-request
url: "{{base_url}}/api/v1/coaches"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "QA",
      "lastName": "Coach {{run}}",
      "gender": "MALE",
      "phone": "{{phoneCoach}}",
      "email": "qa.coach.{{run}}@example.com",
      "password": "{{testPassword}}",
      "specialty": "QA"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('coachId', pm.response.json().coachId);
    language: text/javascript
order: 7000
