$kind: http-request
url: "{{base_url}}/api/v1/packages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "packageName": "QA Package {{run}}",
      "durationDays": 30,
      "description": "Gói tạo bởi bộ test",
      "price": 100000
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('packageId', pm.response.json().packageId);
    language: text/javascript
order: 6000
