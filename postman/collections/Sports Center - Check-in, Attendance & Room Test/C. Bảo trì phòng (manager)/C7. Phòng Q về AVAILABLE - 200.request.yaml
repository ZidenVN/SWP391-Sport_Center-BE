$kind: http-request
name: C7. Phòng Q về AVAILABLE -> 200
url: "{{base_url}}/api/v1/rooms/{{roomQId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "roomName": "QA Room Q {{run}}",
      "capacity": 20,
      "status": "AVAILABLE"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('status = AVAILABLE', () => pm.expect(pm.response.json().status).to.eql('AVAILABLE'));
    language: text/javascript
order: 7000
