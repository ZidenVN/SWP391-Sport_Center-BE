$kind: http-request
name: A2. Coach gọi /members/me/attendances -> 403
url: "{{base_url}}/api/v1/members/me/attendances"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{coachToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
