$kind: http-request
url: "{{base_url}}/api/v1/subjects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "subjectName": "QA Subject {{run}}",
      "description": "Môn tạo bởi bộ test"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('subjectId', pm.response.json().subjectId);
    language: text/javascript
order: 1000
