$kind: http-request
url: "{{base_url}}/api/v1/rooms/{{roomId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "roomName": "QA Room {{run}}",
      "capacity": 20,
      "status": "AVAILABLE"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 8000
