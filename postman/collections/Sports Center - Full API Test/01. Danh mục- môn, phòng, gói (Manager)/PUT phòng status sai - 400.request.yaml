$kind: http-request
name: PUT phòng status sai -> 400
url: "{{base_url}}/api/v1/rooms/{{roomId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "roomName": "QA Room {{run}}",
      "capacity": 20,
      "status": "abc"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 9000
