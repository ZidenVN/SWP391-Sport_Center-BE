$kind: http-request
url: "{{base_url}}/api/v1/rooms"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "roomName": "QA Room {{run}}",
      "capacity": 20
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('roomId', pm.response.json().roomId);
    language: text/javascript
order: 5000
