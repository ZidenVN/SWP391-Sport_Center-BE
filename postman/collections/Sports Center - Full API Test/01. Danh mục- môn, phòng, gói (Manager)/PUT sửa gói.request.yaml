$kind: http-request
url: "{{base_url}}/api/v1/packages/{{packageId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "packageName": "QA Package {{run}}",
      "durationDays": 30,
      "description": "Đã sửa",
      "price": 120000
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 13000
