$kind: http-request
url: "{{base_url}}/api/v1/coaches/workout-results/{{resultId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "memberId": {{memberId}},
      "activityDetails": "Hoàn thành 50 phút",
      "coachFeedback": "Rất tốt"
    }
auth:
  type: bearer
  credentials:
    token: "{{coachToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 13000
