$kind: http-request
url: "{{base_url}}/api/v1/coaches/me/workout-plans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "planName": "QA plan cá nhân {{run}}",
      "exerciseDetails": "Giãn cơ 20 phút mỗi ngày",
      "duration": "1 tuần",
      "dueDate": "{{in7}}",
      "targetType": "INDIVIDUAL",
      "targetId": {{memberId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{coachToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 7000
