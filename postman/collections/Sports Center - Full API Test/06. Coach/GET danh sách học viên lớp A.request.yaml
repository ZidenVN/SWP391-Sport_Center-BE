$kind: http-request
url: "{{base_url}}/api/v1/coaches/me/classes/{{classId}}/roster"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{coachToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 2000
