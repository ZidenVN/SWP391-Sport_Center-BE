$kind: http-request
url: "{{base_url}}/api/v1/coaches/classes/{{classId}}/notifications"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "QA thông báo lớp",
      "content": "Nhớ mang thảm"
    }
auth:
  type: bearer
  credentials:
    token: "{{coachToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 15000
