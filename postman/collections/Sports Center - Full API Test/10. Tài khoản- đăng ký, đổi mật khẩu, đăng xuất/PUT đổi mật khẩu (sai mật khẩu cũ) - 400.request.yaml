$kind: http-request
name: PUT đổi mật khẩu (sai mật khẩu cũ) -> 400
url: "{{base_url}}/api/v1/auth/change-password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "sai-mat-khau",
      "newPassword": "{{testPassword}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('error = ERR_AUTH_001', () => pm.expect(pm.response.json().error).to.eql('ERR_AUTH_001'));
    language: text/javascript
order: 3000
