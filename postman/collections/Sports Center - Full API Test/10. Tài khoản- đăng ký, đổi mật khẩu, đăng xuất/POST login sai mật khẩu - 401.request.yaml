$kind: http-request
name: POST login sai mật khẩu -> 401
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "qa.reg.{{run}}@example.com",
      "password": "sai-mat-khau"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('HTTP 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
