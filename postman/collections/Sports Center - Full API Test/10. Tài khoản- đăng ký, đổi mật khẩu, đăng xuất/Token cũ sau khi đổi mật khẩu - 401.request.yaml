$kind: http-request
name: Token cũ sau khi đổi mật khẩu -> 401
url: "{{base_url}}/api/v1/members/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 5000
