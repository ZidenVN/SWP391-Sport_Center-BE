$kind: http-request
url: "{{base_url}}/api/v1/auth/change-password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{memberTempPassword}}",
      "newPassword": "{{testPassword}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code < 300) pm.collectionVariables.set('memberToken2', pm.response.json().token);
    language: text/javascript
order: 4000
