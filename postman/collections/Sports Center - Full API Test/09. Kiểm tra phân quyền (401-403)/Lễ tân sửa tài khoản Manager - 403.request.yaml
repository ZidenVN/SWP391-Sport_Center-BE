$kind: http-request
name: Lễ tân sửa tài khoản Manager -> 403
url: "{{base_url}}/api/v1/users/{{managerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 7000
