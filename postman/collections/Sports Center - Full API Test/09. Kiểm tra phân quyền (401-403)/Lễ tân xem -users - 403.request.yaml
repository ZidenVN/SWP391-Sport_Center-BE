$kind: http-request
name: Lễ tân xem /users -> 403
url: "{{base_url}}/api/v1/users"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
