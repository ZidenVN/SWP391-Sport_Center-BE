$kind: http-request
name: Manager gọi API /members/me -> 403
url: "{{base_url}}/api/v1/members/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 12000
