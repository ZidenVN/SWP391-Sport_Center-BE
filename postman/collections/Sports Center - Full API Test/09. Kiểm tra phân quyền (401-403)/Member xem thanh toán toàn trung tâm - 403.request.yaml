$kind: http-request
name: Member xem thanh toán toàn trung tâm -> 403
url: "{{base_url}}/api/v1/manager/payments"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
