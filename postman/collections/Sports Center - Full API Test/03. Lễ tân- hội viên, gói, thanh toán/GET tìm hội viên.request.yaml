$kind: http-request
url: "{{base_url}}/api/v1/receptionist/members?keyword={{run}}"
method: GET
queryParams:
  keyword: "{{run}}"
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 2000
