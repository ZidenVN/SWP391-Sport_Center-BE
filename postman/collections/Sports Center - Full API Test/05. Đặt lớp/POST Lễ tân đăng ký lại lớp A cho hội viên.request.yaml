$kind: http-request
url: "{{base_url}}/api/v1/receptionist/members/{{memberId}}/registrations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "classId": {{classId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('registrationId', pm.response.json().registrationId);
    language: text/javascript
order: 4000
