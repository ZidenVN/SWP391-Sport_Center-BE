$kind: http-request
name: POST đặt lại lớp A -> 409
url: "{{base_url}}/api/v1/members/me/registrations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "classId": {{classId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('error = ERR_CLASS_002', () => pm.expect(pm.response.json().error).to.eql('ERR_CLASS_002'));
    language: text/javascript
order: 2000
