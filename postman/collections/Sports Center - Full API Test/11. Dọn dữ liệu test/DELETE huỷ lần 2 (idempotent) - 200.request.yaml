$kind: http-request
name: DELETE huỷ lần 2 (idempotent) -> 200
url: "{{base_url}}/api/v1/receptionist/members/{{memberId}}/registrations/{{registrationId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
