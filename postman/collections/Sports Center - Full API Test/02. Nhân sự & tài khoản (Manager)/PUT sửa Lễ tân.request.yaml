$kind: http-request
url: "{{base_url}}/api/v1/manager/receptionists/{{staffId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "QA",
      "lastName": "Recep {{run}} (sửa)",
      "gender": "FEMALE",
      "email": "qa.recep.{{run}}@example.com",
      "phone": "{{phoneRecep}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 8000
