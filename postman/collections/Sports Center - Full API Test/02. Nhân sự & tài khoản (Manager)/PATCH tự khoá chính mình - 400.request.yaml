$kind: http-request
name: PATCH tự khoá chính mình -> 400
url: "{{base_url}}/api/v1/users/{{managerId}}/status"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('error = ERR_USER_003', () => pm.expect(pm.response.json().error).to.eql('ERR_USER_003'));
    language: text/javascript
order: 17000
