$kind: http-request
name: PATCH gán role sai loại -> 400
url: "{{base_url}}/api/v1/users/{{coachId}}/role/{{memberRoleId}}"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('error = ERR_ROLE_400', () => pm.expect(pm.response.json().error).to.eql('ERR_ROLE_400'));
    language: text/javascript
order: 18000
