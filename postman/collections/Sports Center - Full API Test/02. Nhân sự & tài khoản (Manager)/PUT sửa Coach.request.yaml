$kind: http-request
url: "{{base_url}}/api/v1/coaches/{{coachId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "QA",
      "lastName": "Coach {{run}}",
      "gender": "MALE",
      "phone": "{{phoneCoach}}",
      "email": "qa.coach.{{run}}@example.com",
      "specialty": "QA Updated"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 4000
