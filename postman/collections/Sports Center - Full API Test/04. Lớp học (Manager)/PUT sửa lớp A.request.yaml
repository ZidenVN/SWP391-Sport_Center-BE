$kind: http-request
url: "{{base_url}}/api/v1/classes/{{classId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "maxCapacity": 15,
      "startTime": "{{classStart}}",
      "endTime": "{{classEnd}}",
      "coachId": {{coachId}},
      "roomId": {{roomId}},
      "subjectId": {{subjectId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 9000
