$kind: http-request
name: POST sức chứa vượt phòng -> 400
url: "{{base_url}}/api/v1/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "maxCapacity": 50,
      "startTime": "{{classBStart}}",
      "endTime": "{{classBEnd}}",
      "coachId": {{coachId}},
      "roomId": {{roomId}},
      "subjectId": {{subjectId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('error = ERR_CLASS_007', () => pm.expect(pm.response.json().error).to.eql('ERR_CLASS_007'));
    language: text/javascript
order: 4000
