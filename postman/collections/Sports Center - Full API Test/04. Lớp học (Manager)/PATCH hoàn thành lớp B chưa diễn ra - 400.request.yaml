$kind: http-request
name: PATCH hoàn thành lớp B chưa diễn ra -> 400
url: "{{base_url}}/api/v1/classes/{{classBId}}/complete"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('error = ERR_CLASS_010', () => pm.expect(pm.response.json().error).to.eql('ERR_CLASS_010'));
    language: text/javascript
order: 11000
