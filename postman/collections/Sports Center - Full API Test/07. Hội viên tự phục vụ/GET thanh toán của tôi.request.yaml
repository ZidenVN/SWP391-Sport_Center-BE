$kind: http-request
url: "{{base_url}}/api/v1/members/me/payments"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 5000
