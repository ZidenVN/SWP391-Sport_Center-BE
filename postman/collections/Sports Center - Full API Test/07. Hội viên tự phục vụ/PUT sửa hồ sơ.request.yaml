$kind: http-request
url: "{{base_url}}/api/v1/members/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "QA",
      "lastName": "Member {{run}}",
      "gender": "FEMALE",
      "phone": "{{phoneMember}}",
      "trainingGoal": "Tăng sức bền"
    }
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 2000
