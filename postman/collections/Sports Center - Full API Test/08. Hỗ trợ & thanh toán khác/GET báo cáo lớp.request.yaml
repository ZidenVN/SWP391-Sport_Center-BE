$kind: http-request
url: "{{base_url}}/api/v1/manager/reports/classes?fromDate={{today}}&toDate={{in7}}"
method: GET
queryParams:
  fromDate: "{{today}}"
  toDate: "{{in7}}"
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 11000
