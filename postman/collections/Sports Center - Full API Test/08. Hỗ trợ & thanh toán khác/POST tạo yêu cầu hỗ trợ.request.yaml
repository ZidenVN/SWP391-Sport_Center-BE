$kind: http-request
url: "{{base_url}}/api/v1/receptionist/tickets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "memberId": {{memberId}},
      "content": "QA: tủ đồ bị kẹt"
    }
auth:
  type: bearer
  credentials:
    token: "{{receptionistToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code < 300) pm.collectionVariables.set('ticketId', pm.response.json().ticketId);
    language: text/javascript
order: 1000
