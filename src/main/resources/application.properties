spring.application.name=sports-center-manager
spring.config.import=optional:classpath:application-local.properties

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sportcenter_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
#spring.datasource.url=jdbc:mysql://0.tcp.ap.ngrok.io:13576/sportcenter_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Cố định múi giờ Việt Nam khi chuyển đổi JSON
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# -- THANH TOAN VNPAY
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
#-- 86400000 ms = 24h = 1000L*60*60*24

# Google
# Client ID Google không phải bí mật -> để sẵn mặc định cho cả nhóm; ghi đè bằng GOOGLE_CLIENT_ID nếu dùng client khác
google.client-id=${GOOGLE_CLIENT_ID:292845719554-mj6mhmh4snhmghljufj8iqg66mgktgvf.apps.googleusercontent.com}

# Tài khoản mặc định tạo lúc khởi động (để trống = không tạo)
app.init.manager.password=${APP_INIT_MANAGER_PASSWORD:}
app.init.coach.password=${APP_INIT_COACH_PASSWORD:}
app.init.receptionist.password=${APP_INIT_RECEPTIONIST_PASSWORD:}

# CORS: các origin frontend được phép gọi API, ngăn cách bằng dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

#UI front end response ve sau khi thanh toan xong
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment-result}
#vnpay.return-url=http://localhost:8080/api/v1/payments/vnpay/callback

# Trợ lý AI (Claude): đặt ANTHROPIC_API_KEY (biến môi trường) hoặc ai.anthropic.api-key trong application-local.properties để bật.
# Để trống thì chức năng AI vẫn chạy bằng bộ gợi ý tự động dựa trên dữ liệu thật.
ai.anthropic.model=claude-opus-5-5
