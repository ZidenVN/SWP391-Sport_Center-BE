spring.application.name=sports-center-manager

server.port=${PORT:8080}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sportcenter_db?allowPublicKeyRetrieval=true&useSSL=false}
#spring.datasource.url=jdbc:mysql://0.tcp.ap.ngrok.io:13576/sportcenter_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mypasswordisnull}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
