spring.application.name=sports-center-manager
spring.config.import=optional:classpath:application-local.properties

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sportcenter_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
#spring.datasource.url=jdbc:mysql://0.tcp.ap.ngrok.io:13576/sportcenter_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
 # spring.jpa.show-sql=false khi cần debug thì chuyển thành true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Cố định múi giờ Việt Nam khi chuyển đổi JSON
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# -- THANH TOAN VNPAY
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
#-- 86400000 ms = 24h = 1000L*60*60*24

app.reminder.subscription-days-before=3
app.reminder.subscription-cron=0 0 8 * * *
app.reminder.class-hours-before=24
app.reminder.class-cron=0 */15 * * * *
app.attendance.open-minutes-before=${ATTENDANCE_OPEN_MINUTES_BEFORE:15}
app.attendance.close-hours-after=${ATTENDANCE_CLOSE_HOURS_AFTER:24}

# Google
google.client-id=${GOOGLE_CLIENT_ID}

# Tài khoản mặc định tạo lúc khởi động (để trống = không tạo)
app.init.manager.password=${APP_INIT_MANAGER_PASSWORD:}
app.init.coach.password=${APP_INIT_COACH_PASSWORD:}
app.init.receptionist.password=${APP_INIT_RECEPTIONIST_PASSWORD:}

# CORS: các origin frontend được phép gọi API, ngăn cách bằng dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

#UI front end response ve sau khi thanh toan xong
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment-result}
#vnpay.return-url=http://localhost:8080/api/v1/payments/vnpay/callback

# Booking class: chri được huỷ trước giờ học ít nhất N giờ (D-07)
app.booking.cancel-cutoff-hours=${BOOKING_CANCEL_CUTOFF_HOURS:2}

#Cloudinary: lưu ảnh lớp học,
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Trợ lý AI (Google Gemini)
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.8-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.daily-limit.member=30
ai.history-size=20

# Upload anh <= 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
